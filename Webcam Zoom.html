<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webcam Zoom</title>
<style>
  :root { --bg:#0e0f13; --panel:#191b22ee; --line:#2c2f3a; --text:#eceef4; --dim:#9aa0b0; --accent:#6c8cff; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--text);
    font:15px/1.4 system-ui,"Segoe UI",sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; overflow:hidden; cursor:grab; touch-action:none; background:#000; }
  #stage.dragging { cursor:grabbing; }
  #pan { width:100%; height:100%; transform-origin:0 0; will-change:transform; }
  video { width:100%; height:100%; object-fit:contain; display:block; }
  video.mirror { transform:scaleX(-1); }
  #msg { position:fixed; inset:0; display:grid; place-items:center; text-align:center; padding:24px;
    color:var(--dim); font-size:17px; pointer-events:none; }
  #msg:empty { display:none; }
  #bar { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); display:flex; gap:10px;
    align-items:center; flex-wrap:wrap; justify-content:center; max-width:calc(100% - 24px);
    padding:10px 14px; background:var(--panel); border:1px solid var(--line); border-radius:14px;
    backdrop-filter:blur(10px); box-shadow:0 8px 30px #0008; transition:opacity .3s; }
  body.idle #bar { opacity:0; pointer-events:none; }
  body.idle #stage { cursor:none; }
  button,select { font:inherit; color:var(--text); background:#262935; border:1px solid var(--line);
    border-radius:9px; padding:7px 12px; cursor:pointer; }
  button:hover,select:hover { background:#303443; border-color:var(--accent); }
  button:focus-visible,select:focus-visible,input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .round { width:36px; padding:7px 0; font-size:18px; line-height:1; }
  select { max-width:200px; }
  input[type=range] { width:180px; accent-color:var(--accent); }
  #zlabel { min-width:44px; text-align:right; font-variant-numeric:tabular-nums; color:var(--dim); }
</style>
</head>
<body>
<div id="stage"><div id="pan"><video id="video" class="mirror" autoplay playsinline muted></video></div></div>
<div id="msg" role="status">Starting camera…</div>

<div id="bar">
  <select id="cams" aria-label="Camera" hidden></select>
  <button id="out" class="round" aria-label="Zoom out" title="Zoom out (-)">−</button>
  <input id="zoom" type="range" min="1" max="8" step="0.01" value="1" aria-label="Zoom">
  <button id="in" class="round" aria-label="Zoom in" title="Zoom in (+)">+</button>
  <span id="zlabel">1.0×</span>
  <button id="reset" title="Reset (0)">Reset</button>
  <button id="mirror" aria-pressed="true" title="Mirror (M)">Mirror</button>
  <button id="full" title="Fullscreen (F)">Fullscreen</button>
</div>

<script>
const MIN = 1, MAX = 8;
const $ = id => document.getElementById(id);
const stage = $('stage'), pan = $('pan'), video = $('video'), msg = $('msg'),
      cams = $('cams'), slider = $('zoom'), zlabel = $('zlabel');

let view = { z: 1, x: 0, y: 0 };

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

// Zoom to z2 keeping stage point (px,py) fixed; keep the picture covering the stage (w,h).
function zoomAt(v, z2, px, py, w, h) {
  z2 = clamp(z2, MIN, MAX);
  const k = z2 / v.z;
  return {
    z: z2,
    x: clamp(px - (px - v.x) * k, w - w * z2, 0),
    y: clamp(py - (py - v.y) * k, h - h * z2, 0),
  };
}

// self-check
{
  const a = zoomAt({ z: 1, x: 0, y: 0 }, 2, 50, 50, 100, 100);
  console.assert(a.z === 2 && a.x === -50 && a.y === -50, 'zoom at centre', a);
  const b = zoomAt(a, 1, 0, 0, 100, 100);
  console.assert(b.z === 1 && b.x === 0 && b.y === 0, 'zoom back out clamps to full view', b);
  console.assert(zoomAt(a, 99, 0, 0, 100, 100).z === MAX, 'max zoom');
}

function apply(v) {
  view = v;
  pan.style.transform = `translate(${v.x}px,${v.y}px) scale(${v.z})`;
  slider.value = v.z;
  zlabel.textContent = v.z.toFixed(1) + '×';
}

function zoomTo(z, px = stage.clientWidth / 2, py = stage.clientHeight / 2) {
  apply(zoomAt(view, z, px, py, stage.clientWidth, stage.clientHeight));
}
const zoomBy = f => zoomTo(view.z * f);

// --- camera ---
let stream, gen = 0;
const stop = s => s?.getTracks().forEach(t => t.stop());
const currentId = () => stream?.getVideoTracks()[0]?.getSettings().deviceId;

async function start(deviceId) {
  const my = ++gen;
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('unsupported');
    const s = await navigator.mediaDevices.getUserMedia({
      video: { deviceId: deviceId ? { exact: deviceId } : undefined,
               width: { ideal: 1920 }, height: { ideal: 1080 } },
    });
    if (my !== gen) return stop(s); // a newer switch won
    stop(stream); // old camera stays on until the new one works
    stream = s;
    s.getVideoTracks()[0].onended = () => { msg.textContent = 'The webcam was disconnected. Plug it in and reload.'; };
    video.srcObject = s;
    msg.textContent = '';
    listCams().catch(() => {});
  } catch (e) {
    if (stream) listCams().catch(() => {}); // put the picker back on the camera that still works
    msg.textContent =
      e.name === 'NotAllowedError' ? 'Camera access was blocked. Allow the camera for this page, then reload.' :
      e.name === 'NotFoundError' || e.name === 'OverconstrainedError' ? 'No webcam found. Plug one in and reload.' :
      e.name === 'NotReadableError' ? 'The webcam is in use by another program. Close it and reload.' :
      'Could not start the webcam. Try Chrome or Edge.';
  }
}

async function listCams() {
  const current = currentId();
  const list = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  cams.replaceChildren(...list.map((d, i) => new Option(d.label || `Camera ${i + 1}`, d.deviceId, false, d.deviceId === current)));
  cams.hidden = list.length < 2;
}

cams.onchange = () => start(cams.value);
navigator.mediaDevices?.addEventListener('devicechange', () => listCams().catch(() => {}));

// --- controls ---
slider.oninput = () => zoomTo(+slider.value);
$('in').onclick = () => zoomBy(1.25);
$('out').onclick = () => zoomBy(0.8);
$('reset').onclick = () => zoomTo(1);
$('mirror').onclick = e => e.currentTarget.setAttribute('aria-pressed', video.classList.toggle('mirror'));
const fullscreen = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
$('full').onclick = fullscreen;

stage.addEventListener('wheel', e => {
  e.preventDefault();
  zoomTo(view.z * Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY);
}, { passive: false });

let dragId = null, lastX, lastY; // one pointer drags; clientX deltas work for touch and scaled displays
stage.addEventListener('pointerdown', e => {
  if (dragId !== null) return;
  dragId = e.pointerId; lastX = e.clientX; lastY = e.clientY;
  stage.setPointerCapture(dragId);
  stage.classList.add('dragging');
});
stage.addEventListener('pointermove', e => {
  if (e.pointerId !== dragId) return;
  const w = stage.clientWidth, h = stage.clientHeight;
  apply({ z: view.z,
          x: clamp(view.x + e.clientX - lastX, w - w * view.z, 0),
          y: clamp(view.y + e.clientY - lastY, h - h * view.z, 0) });
  lastX = e.clientX; lastY = e.clientY;
});
const endDrag = e => { if (e.pointerId === dragId) { dragId = null; stage.classList.remove('dragging'); } };
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('dblclick', e => zoomTo(view.z > 1 ? 1 : 2, e.clientX, e.clientY));

addEventListener('keydown', e => {
  if (e.target.matches?.('select, input') || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === '+' || k === '=') zoomBy(1.25);
  else if (k === '-') zoomBy(0.8);
  else if (k === '0') zoomTo(1);
  else if (k === 'm') $('mirror').click();
  else if (k === 'f') fullscreen();
});

addEventListener('resize', () => zoomTo(view.z)); // re-clamp pan to new size

// hide the bar when the mouse rests
let idleTimer;
function wake() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!$('bar').matches(':hover, :focus-within')) document.body.classList.add('idle'); }, 3000);
}
['pointermove', 'pointerdown', 'keydown', 'wheel'].forEach(t => addEventListener(t, wake, { passive: true }));
wake();

start();
</script>
</body>
</html>
